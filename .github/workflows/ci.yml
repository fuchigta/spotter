name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# actions/setup-go は GOTOOLCHAIN=local にするため、tools/ の Go 1.26 を要するツール
# （golangci-lint・shfmt・go-test-coverage など）がビルドできない。auto に戻し、go.mod が
# 求める版を go コマンドに取得させる。本体のモジュールは入れた版のまま動く。
env:
  GOTOOLCHAIN: auto

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  lint:
    name: format & tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt で整形されていないファイルがあります:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy
          for d in tools/*/; do go -C "$d" mod tidy; done
          if ! git diff --exit-code -- go.mod go.sum tools; then
            echo "go mod tidy による差分があります。ローカルで go mod tidy と tools/ 以下の各ディレクトリで go mod tidy を実行してコミットしてください。"
            exit 1
          fi

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # golangci-lint（tools/golangci-lint/go.mod で固定）が要求する Go のバージョンは
          # 本体の go.mod より新しいため、そちらを基準にする。
          go-version-file: tools/golangci-lint/go.mod
          cache: true

      - name: golangci-lint run
        run: bash scripts/tool.sh golangci-lint run ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -coverprofile
        run: go test -coverprofile=cover.out ./...

      # パッケージごとの基準値は .testcoverage.yml にある。下回ったら不合格にする。
      - name: go-test-coverage
        run: bash scripts/tool.sh go-test-coverage --config .testcoverage.yml

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race
        run: go test -race ./...

  spotter:
    name: spotter check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: spotter range
        id: range
        run: echo "range=$(go run ./cmd/spotter range)" >> "$GITHUB_OUTPUT"

      - name: spotter check
        run: go run ./cmd/spotter check --range "${{ steps.range.outputs.range }}"
