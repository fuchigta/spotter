name: jscpd

# コピー＆ペーストによる重複が増えていないかを確かめる。jscpd は Go 製ではないため
# tools/ では固定せず、npx の版指定で固定する。設定は .jscpd.json にあり、JSON には
# コメントを書けないので設定の根拠はここに残す。
#
# - 版: jscpd 5.4.3（Rust エンジン）
# - 検出の基準: 既定値（min-tokens 50・min-lines 5・mode mild）。.gitignore は既定で除外される
# - 実測: 140 ファイル・17 クローン、重複率は行 1.02%・トークン 1.04%
# - threshold: 行の重複率と比べられ、超えたときだけ失敗する。実測に約 0.5 ポイントの余裕を
#   持たせて 1.5 に置くラチェットとして扱い、重複を減らして実測が下がったら threshold も引き下げる
# - ignore:
#   - **/*_test.go: テーブル駆動テストは性質上似た形が並び、ゲートで見たいのは本番コードの
#     重複であるため外す。テストを含めると 194 ファイル・246 クローン・行 6.91% で、クローンの
#     大半（229 件）がテスト同士のため、本番コードの重複が増えても埋もれてしまう
#   - .claude/skills/: skills-lock.json で管理する外部から入れたスキルで、このリポジトリで
#     書いたコードではないため外す
#   - 手元で測るときは --ignore を渡さず .jscpd.json を使う。CLI の --ignore は .jscpd.json の
#     ignore に足されるのではなく置き換えるため、数値がずれる
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  jscpd:
    name: jscpd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: jscpd
        run: npx --yes jscpd@5.4.3 --no-tips --no-colors .
