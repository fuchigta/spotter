types:
  check-issue-refs:
    command: bash
    args: [scripts/check-issue-refs.sh]
    default:
      granularity: per-commit

checks:
  check-issue-refs:
    type: check-issue-refs

  doc-sync:
    type: doc-sync
    pairs:
      # README.md（コマンド一覧）
      - paths: 'internal/cli/*.go'
        doc: README.md

      # docs/checks/*.md（検査ごとの実装とドキュメントの対応）
      - paths: 'internal/check/docsync/*.go'
        doc: docs/checks/doc-sync.md
      - paths: 'internal/check/unwantedfiles/*.go'
        doc: docs/checks/unwanted-files.md
      - paths: 'internal/check/docpaths/*.go'
        doc: docs/checks/doc-paths.md
      - paths: 'internal/check/doclinks/*.go'
        doc: docs/checks/doc-links.md
      - paths: 'internal/check/docutil/*.go'
        doc: docs/checks/doc-paths.md
      - paths: 'internal/check/diffsize/*.go'
        doc: docs/checks/diff-size.md
      - paths: 'internal/check/check.go'
        doc: docs/checks/diff-size.md
      - paths: 'internal/gitutil/*.go'
        doc: docs/checks/diff-size.md
      - paths: 'internal/check/commitsubject/*.go'
        doc: docs/checks/commit-subject.md
      - paths: 'internal/check/commitintent/*.go'
        doc: docs/checks/commit-intent.md
      - paths: 'internal/commitmsg/*.go'
        doc: docs/checks/commit-intent.md
      - paths: 'internal/check/companionfiles/*.go'
        doc: docs/checks/companion-files.md
      - paths: 'internal/check/consistency/*.go'
        doc: docs/checks/consistency.md
      - paths: 'internal/check/diffcontent/*.go'
        doc: docs/checks/diff-content.md
      - paths: 'internal/check/command/*.go'
        doc: docs/checks/command.md
      - paths: 'internal/schema/*.go'
        doc: docs/checks/command.md

      # docs/granularity.md（起動粒度の共通定義と range 展開ロジック）
      - paths: 'internal/check/check.go'
        doc: docs/granularity.md
      - paths: 'internal/rangespec/*.go'
        doc: docs/granularity.md

      # docs/exemptions.md（免除トレーラの判定ロジック）
      - paths: 'internal/exempt/*.go'
        doc: docs/exemptions.md

      # docs/ci-integration.md（CI 側の範囲自動検出）
      - paths: 'internal/cirange/*.go'
        doc: docs/ci-integration.md
      - paths: 'internal/cli/range.go'
        doc: docs/ci-integration.md

      # docs/hooks.md（フックの設置ロジック）
      - paths: 'internal/hooks/*.go'
        doc: docs/hooks.md
      - paths: 'internal/cli/hooks.go'
        doc: docs/hooks.md

      # docs/config-reference.md（.spotter.yml 全体のスキーマ）
      - paths: 'internal/config/*.go'
        doc: docs/config-reference.md

      # docs/versioning.md（required_version の判定ロジック）
      - paths: 'internal/version/*.go'
        doc: docs/versioning.md
      - paths: 'internal/cli/root.go'
        doc: docs/versioning.md

      # docs/README.md（目次。レベル1見出し＝ページタイトルが変わったときだけ）
      - paths: 'docs/**/*.md'
        doc: docs/README.md
        when: '^[+-]# '

    exclude:
      - '**/*_test.go'

  unwanted-files:
    type: unwanted-files
    max_bytes: 1048576
    deny:
      - { paths: '**/*.log', reason: 'ログファイル' }
      - { paths: '**/.env', reason: '環境変数・シークレット' }
      - { paths: '**/.env.*', reason: '環境変数・シークレット' }
      - { paths: '**/*.pem', reason: '秘密鍵' }
      - { paths: '**/*.key', reason: '秘密鍵' }
      - { paths: 'spotter', reason: 'ビルド成果物' }
      - { paths: 'spotter.exe', reason: 'ビルド成果物' }
      - { paths: '**/*.exe', reason: 'ビルド成果物' }
      - { paths: '**/*.test', reason: 'ビルド成果物' }
      - { paths: 'dist/**', reason: 'ビルド成果物' }

  doc-paths:
    type: doc-paths
    path_prefixes: [internal, cmd, scripts, .github]

  commit-subject:
    type: commit-subject
    allowed_types: [feat, fix, perf, refactor, docs, test, build, ci, chore, revert]

  commit-types-consistency:
    type: consistency
    sources:
      - file: cliff.toml
        extract: 'message = "\^([a-zA-Z]+)"'
      - file: .spotter.yml
        extract: 'allowed_types:\s*\[(.*)\]'
        split: ','

  diff-content:
    type: diff-content
    deny:
      - { pattern: '^<{7}|^={7}|^>{7}', reason: 'コンフリクトマーカー' }
      - { pattern: '//\s*nolint', reason: 'lint エラーの抑制' }
      - { pattern: '\bt\.Skip(Now)?\(', reason: 'テストのスキップ残し', paths: '**/*_test.go' }
      - { pattern: '^\s*func Test\w+\(', reason: 'テストの削除', on: removed, paths: '**/*_test.go' }

  commit-intent:
    type: commit-intent
    rules:
      - types: [docs]
        allow: ['**/*.md', 'docs/**']
        reason: 'docs はドキュメントだけを変更する'
      - types: [feat, fix]
        require: ['**/*_test.go']
        reason: '振る舞いの変更には Go のテストを伴う'

  companion-files:
    type: companion-files
    companions:
      - paths: 'internal/check/*/*.go'
        companion: '{dir}/{name}_test.go'
        reason: 'Go のテストが無い'
        exclude: ['**/*_test.go']
      - paths: 'internal/commitmsg/*.go'
        companion: '{dir}/{name}_test.go'
        reason: 'Go のテストが無い'
        exclude: ['**/*_test.go']

  doc-links:
    type: doc-links

  diff-size:
    type: diff-size
    max_files: 30
    max_lines: 1500
    exclude:
      - '**/*.sum'
