types:
  check-issue-refs:
    command: bash
    args: [scripts/check-issue-refs.sh]
    default:
      granularity: per-commit
  commit-lang:
    command: bash
    args: [scripts/check-commit-lang.sh]
    default:
      granularity: per-commit
  context-identifiers:
    command: bash
    args: [scripts/check-context-identifiers.sh]
    default:
      granularity: worktree
  # tools/ で固定した OSS を command 型検査として使う。シークレットは後から消しても
  # 履歴に残るのでコミットごとに見る。ワークフローとシェルスクリプトは今の中身を見る。
  gitleaks:
    command: bash
    args: [scripts/check-gitleaks.sh]
    default:
      granularity: per-commit
  actionlint:
    command: bash
    args: [scripts/worktree-tool.sh, actionlint, --]
    default:
      granularity: worktree
  shfmt:
    command: bash
    args: [scripts/worktree-tool.sh, shfmt, -d, scripts, --]
    default:
      granularity: worktree

checks:
  check-issue-refs:
    type: check-issue-refs

  commit-lang:
    type: commit-lang

  context-identifiers:
    type: context-identifiers

  gitleaks:
    type: gitleaks

  actionlint:
    type: actionlint

  shfmt:
    type: shfmt

  doc-sync:
    type: doc-sync
    pairs:
      # README.md（コマンド一覧）。checks.go は spotter checks --json 用の検査
      # オプションの一覧で、README のコマンド一覧には影響しないため対象から外す。
      - paths: 'internal/cli/*.go'
        doc: README.md
        exclude:
          - 'internal/cli/checks.go'

      # docs/checks/*.md（検査ごとの実装とドキュメントの対応）
      - paths: 'internal/check/docsync/*.go'
        doc: docs/checks/doc-sync.md
      - paths: 'internal/check/unwantedfiles/*.go'
        doc: docs/checks/unwanted-files.md
      - paths: 'internal/check/docpaths/*.go'
        doc: docs/checks/doc-paths.md
      - paths: 'internal/check/doclinks/*.go'
        doc: docs/checks/doc-links.md
      - paths: 'internal/check/docutil/*.go'
        doc: docs/checks/doc-paths.md
      - paths: 'internal/check/diffsize/*.go'
        doc: docs/checks/diff-size.md
      - paths: 'internal/check/check.go'
        doc: docs/checks/diff-size.md
      - paths: 'internal/check/commitsubject/*.go'
        doc: docs/checks/commit-subject.md
      - paths: 'internal/check/commitintent/*.go'
        doc: docs/checks/commit-intent.md
      - paths: 'internal/commitmsg/*.go'
        doc: docs/checks/commit-intent.md
      - paths: 'internal/check/companionfiles/*.go'
        doc: docs/checks/companion-files.md
      - paths: 'internal/check/consistency/*.go'
        doc: docs/checks/consistency.md
      - paths: 'internal/check/diffcontent/*.go'
        doc: docs/checks/diff-content.md
      - paths: 'internal/check/diffutil/*.go'
        doc: docs/checks/diff-content.md
      - paths: 'internal/check/command/*.go'
        doc: docs/checks/command.md
      - paths: 'internal/schema/*.go'
        doc: docs/checks/command.md

      # docs/granularity.md（起動粒度の共通定義と range 展開ロジック）
      - paths: 'internal/check/check.go'
        doc: docs/granularity.md
      - paths: 'internal/rangespec/*.go'
        doc: docs/granularity.md
      - paths: 'internal/gitutil/*.go'
        doc: docs/granularity.md

      # docs/exemptions.md（免除トレーラの判定ロジック）
      - paths: 'internal/exempt/*.go'
        doc: docs/exemptions.md

      # docs/ci-integration.md（CI 側の範囲自動検出）
      - paths: 'internal/cirange/*.go'
        doc: docs/ci-integration.md
      - paths: 'internal/cli/range.go'
        doc: docs/ci-integration.md

      # docs/hooks.md（フックの設置ロジックと pre-push が検査する範囲の決定ロジック）
      - paths: 'internal/hooks/*.go'
        doc: docs/hooks.md
      - paths: 'internal/cli/hooks.go'
        doc: docs/hooks.md
      - paths: 'internal/prepush/*.go'
        doc: docs/hooks.md
      - paths: 'internal/cli/prepush.go'
        doc: docs/hooks.md

      # docs/skills.md（スキルの設置・削除・状態確認ロジック）
      - paths: 'internal/skills/*.go'
        doc: docs/skills.md
      - paths: 'internal/cli/skills.go'
        doc: docs/skills.md

      # docs/config-reference.md（.spotter.yml 全体のスキーマ）
      - paths: 'internal/config/*.go'
        doc: docs/config-reference.md
      - paths: 'internal/confighygiene/*.go'
        doc: docs/config-reference.md

      # docs/versioning.md（required_version の判定ロジック）
      - paths: 'internal/version/*.go'
        doc: docs/versioning.md
      - paths: 'internal/cli/version.go'
        doc: docs/versioning.md

      # docs/update.md（spotter update の最新版の解決と置き換えのロジック）
      - paths: 'internal/update/*.go'
        doc: docs/update.md
      - paths: 'internal/cli/update.go'
        doc: docs/update.md

      # 外部から入れたスキル（spotter-* は .gitignore で除外）は skills-lock.json と一緒に変える
      - paths: '.claude/skills/**'
        doc: skills-lock.json

    exclude:
      - '**/*_test.go'

  unwanted-files:
    type: unwanted-files
    max_bytes: 1048576
    deny:
      - { paths: '**/*.log', reason: 'ログファイル' }
      - { paths: '**/.env', reason: '環境変数・シークレット' }
      - { paths: '**/.env.*', reason: '環境変数・シークレット' }
      - { paths: '**/*.pem', reason: '秘密鍵' }
      - { paths: '**/*.key', reason: '秘密鍵' }
      - { paths: 'spotter', reason: 'ビルド成果物' }
      - { paths: 'spotter.exe', reason: 'ビルド成果物' }
      - { paths: '**/*.exe', reason: 'ビルド成果物' }
      - { paths: '**/*.test', reason: 'ビルド成果物' }
      - { paths: 'dist/**', reason: 'ビルド成果物' }

  doc-paths:
    type: doc-paths
    path_prefixes: [internal, cmd, scripts, .github, .claude-plugin]

  commit-subject:
    type: commit-subject
    allowed_types: &commit-types [feat, fix, perf, refactor, docs, test, build, ci, chore, revert]

  commit-types-consistency:
    type: consistency
    sources:
      - file: cliff.toml
        extract: 'message = "\^([a-zA-Z]+)"'
      - file: .spotter.yml
        extract: 'allowed_types:\s*(?:&\S+\s*)?\[(.*)\]'
        split: ','

  # 組み込み検査 type の一覧を手で転記している箇所の突き合わせ
  check-types-consistency:
    type: consistency
    sources:
      - file: README.md
        extract: '^\| \[`([a-z-]+)`\]\(docs/checks/'
      - file: docs/README.md
        extract: '^\| \[checks/[^]]+\]\([^)]+\) \| `([a-z-]+)` \|'
      - file: skills/spotter-docs/SKILL.md
        line: '^description:'
        extract: '組み込み検査 type（([^）]+)）'
        split: ','

  # go.mod の直接依存（// indirect の無い require）と、AGENTS.md に書いた許可リストの突き合わせ。
  # 依存を足すなら、許可リストも同じコミットで直すことになる。
  direct-deps-consistency:
    type: consistency
    sources:
      - file: go.mod
        extract: '^\t([^ ]+) v[^ ]+$'
      - file: AGENTS.md
        line: '直接依存は最小限'
        until: '突き合わせる$'
        extract: '`((?:github\.com|gopkg\.in|golang\.org)/[^`]+)`'

  # docs/ 配下のページ集合と、目次（docs/README.md）・スキル索引
  # （skills/spotter-docs/SKILL.md）のリンク集合の突き合わせ。ページを増減したのに
  # 目次側を直し忘れる事故を防ぐ。
  docs-index-consistency:
    type: consistency
    sources:
      - glob: 'docs/**/*.md'
        base: docs
        exclude: ['docs/README.md']
      - file: docs/README.md
        extract: '\]\(([^)#]+\.md)\)'
      - file: skills/spotter-docs/SKILL.md
        extract: '`references/([^`]+\.md)`'

  diff-content:
    type: diff-content
    deny:
      - { pattern: '^<{7}|^={7}|^>{7}', reason: 'コンフリクトマーカー' }
      - { pattern: '//\s*nolint', reason: 'lint エラーの抑制', paths: '**/*.go' }
      - { pattern: '\bt\.Skip(Now)?\(', reason: 'テストのスキップ残し', paths: '**/*_test.go' }
      - { pattern: '^\s*func Test\w+\(', reason: 'テストの削除', on: removed, paths: '**/*_test.go', net: true }
      # 一覧は表や spotter checks / spotter skills list に任せ、増減のたびに陳腐化する個数は書かない
      - { pattern: '[0-9０-９]+\s*(種類|本|個)の(組み込み)?(検査|スキル)', reason: '検査やスキルの個数をドキュメントに書かない', paths: '**/*.md' }
      # 検査は Source と Context.FS を外から受け取るので、テストで実 git・実ファイルに頼らない
      - { pattern: 'exec\.Command\("git"|os\.DirFS\(|t\.TempDir\(\)', reason: 'internal/check のテストは fake の Source や fstest.MapFS を使う', paths: 'internal/check/**/*_test.go' }
      # CONTEXT.md の _Avoid_ のうち、別の意味で使われることが無い表記だけを禁止語にする
      - { pattern: 'ユーザー|範囲付き免除|部分免除|検査インスタンス|範囲モード|外部コマンド検査|ワークツリー', reason: 'CONTEXT.md の用語を使う（_Avoid_ の表記を書かない）', paths: '{README.md,AGENTS.md,docs/**/*.md,skills/**/*.md}' }
      # コメントには「なぜ」だけを書き、変更の経緯はコミットメッセージに残す。典型的な言い回しだけを見る
      - { pattern: '//.*(従来|これまでは|以前は|レビュー指摘|レビューで|旧実装|移行元)', reason: 'コメントに変更の経緯を書かない', paths: '**/*.go' }
      - { pattern: '^\s*#.*(従来|これまでは|以前は|レビュー指摘|レビューで|旧実装|移行元)', reason: 'コメントに変更の経緯を書かない', paths: '**/*.{yml,yaml,sh,toml}' }
      # 今の状態を前提にした書き方は、コードが変わっても直されずに古くなる
      - { pattern: '//.*(現時点では|今のところ|暫定)', reason: 'コメントに今の状態を前提にした書き方をしない', paths: '**/*.go' }
      - { pattern: '^\s*#.*(現時点では|今のところ|暫定)', reason: 'コメントに今の状態を前提にした書き方をしない', paths: '**/*.{yml,yaml,sh,toml}' }

  # 検査を通すために lint やカバレッジの基準を緩めていないかを、変更のたびに理由として残させる。
  # 基準を上げる変更も区別できないので、免除トレーラに何を変えたかを書く。
  quality-gate-config:
    type: commit-intent
    rules:
      - types: *commit-types
        deny: ['.golangci.yml', '.testcoverage.yml']
        reason: '品質ゲートの設定を変えるときは理由を書く'

  commit-intent:
    type: commit-intent
    rules:
      - types: [docs]
        allow: ['**/*.md', 'docs/**']
        reason: 'docs はドキュメントだけを変更する'
      - types: [feat, fix]
        require: ['**/*_test.go']
        reason: '振る舞いの変更には Go のテストを伴う'

  companion-files:
    type: companion-files
    companions:
      - paths: 'internal/check/*/*.go'
        companion: '{dir}/{name}_test.go'
        reason: 'Go のテストが無い'
        exclude: ['**/*_test.go']
      - paths: 'internal/commitmsg/*.go'
        companion: '{dir}/{name}_test.go'
        reason: 'Go のテストが無い'
        exclude: ['**/*_test.go']

  doc-links:
    type: doc-links

  diff-size:
    type: diff-size
    max_files: 30
    max_lines: 1500
    exclude:
      - '**/*.sum'
