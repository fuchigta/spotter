version: "2"

linters:
  default: standard
  enable:
    - dupl
    - errorlint
    - gocognit
    - misspell
    - thelper
    - unparam
    - wrapcheck
  settings:
    dupl:
      threshold: 100
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
    gocognit:
      min-complexity: 30
    wrapcheck:
      ignore-package-globs:
        # internal パッケージのエラーは呼び出し元で AGENTS.md の形式（パッケージ名などの
        # 接頭辞つき）で既にラップ済みなので、ここで二重にラップさせない。
        - github.com/fuchigta/spotter/*
  exclusions:
    rules:
      # wrapcheck: テストコードはエラーを利用者に見せるのではなく assert に使うだけなので、
      # ラップの手間を要求しない。
      - path: '_test\.go'
        linters:
          - wrapcheck

      # wrapcheck: cli.Execute() の戻り値は cmd/spotter/main.go がそのまま
      # "spotter: <err>" として表示する、利用者に見せる文言そのもの（cobra 自身が
      # usage やサブコマンド名を含む文言を組み立て済み）。AGENTS.md の
      # 「利用者にそのまま見せる文言はこの限りでない」に当たるので、ラップしない。
      - path: internal/cli/root.go
        linters:
          - wrapcheck
        text: 'cobra\.Command\)\.Execute'

      # misspell: KnownFields(true) の typo 検出を確認するテストが意図的に埋め込んだ
      # 誤字なので直さない（TestLoadRejectsTopLevelTypos）。
      - path: internal/config/config_test.go
        linters:
          - misspell
        text: '`versoin` is a misspelling'
      - path: internal/config/config_test.go
        linters:
          - misspell
        text: '`defualt` is a misspelling'

      # gocognit: この時点で min-complexity(30) を超えている関数。分解はせず、ここに
      # 列挙したものだけ超過を許す。直したら一覧からも外す。

issues:
  # 既定では同文面の指摘が 3 件で打ち切られる。指摘 0 件を保証したいので上限を外す。
  max-issues-per-linter: 0
  max-same-issues: 0
