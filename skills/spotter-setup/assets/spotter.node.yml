# spotter の Node.js/TypeScript プロジェクト向けテンプレート。
# そのまま使わず、リポジトリの実情に合わせて調整し、必ず空振りテストしてから
# 導入してください。このヘッダコメントは導入後に削除して構いません。
# パスの例（src 等）は実際のディレクトリ構成に置き換えること。

# required_version: v0.3.0  # 導入時点の spotter --version の出力（例: "spotter version v0.3.0" なら v0.3.0）に置き換えて有効化する

checks:
  unwanted-files:
    type: unwanted-files
    max_bytes: 1048576
    deny:
      - { paths: '**/*.log', reason: 'ログファイル' }
      - { paths: '**/.env', reason: '環境変数・シークレット' }
      - { paths: '**/.env.*', reason: '環境変数・シークレット' }
      - { paths: '**/*.pem', reason: '秘密鍵' }
      - { paths: '**/*.key', reason: '秘密鍵' }
      - { paths: '**/node_modules/**', reason: '依存ライブラリ' }
      - { paths: '**/dist/**', reason: 'ビルド成果物' }

  doc-links:
    type: doc-links

  doc-paths:
    type: doc-paths
    path_prefixes: [src, lib]

  commit-subject:
    type: commit-subject
    allowed_types: [feat, fix, perf, refactor, docs, test, build, ci, chore, revert]

  diff-content:
    type: diff-content
    deny:
      - { pattern: '^<{7}|^={7}|^>{7}', reason: 'コンフリクトマーカー' }
      - { pattern: '//\s*eslint-disable', reason: 'ESLint の抑制', paths: '**/*.{js,jsx,ts,tsx}' }
      - { pattern: '@ts-ignore|@ts-expect-error', reason: 'TypeScript の型エラー抑制', paths: '**/*.{ts,tsx}' }
      - { pattern: '\.(only|skip)\(', reason: 'テストの絞り込み・スキップ残し', paths: '**/*.{test,spec}.{js,ts}' }

  companion-files:
    type: companion-files
    companions:
      - paths: 'src/**/*.ts'
        companion: '{dir}/{name}.test.ts'
        reason: 'テストが無い'
        exclude: ['**/*.d.ts', '**/*.test.ts', '**/*.spec.ts']

  diff-size:
    type: diff-size
    max_files: 30
    max_lines: 1500
    exclude:
      - '**/package-lock.json'
      - '**/yarn.lock'
      - '**/pnpm-lock.yaml'
